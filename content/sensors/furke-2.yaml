    figures are given there, so every value is an estimate.
  estimates:
    - radar.band
    - radar.r_ref_km
    - radar.max_range_km
    - radar.scan_period_s
    - radar.clutter_rejection
    - radar.eccm_db
    - radar.erp_class_dbw
  sources:
