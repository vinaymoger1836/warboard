  r_ref_km: 120
  sigma_ref_m2: 1
  max_range_km: 250
  scan_period_s: 2
  field_of_regard_deg: 360
  clutter_rejection: 0.85
  pulse_doppler: true
  eccm_db: 15
  erp_class_dbw: 80
  fire_channels: 0
provenance:
  confidence: low
  notes: >-
