id: 92n6e-radar
kind: sensor
name: 92N6E multi-function radar
sensor_type: radar
role: [fire_control, missile_guidance]
radar:
  band: X
  r_ref_km: 200
  sigma_ref_m2: 1
  max_range_km: 340
  scan_period_s: 1
  field_of_regard_deg: 90
  clutter_rejection: 0.9
  pulse_doppler: true
  eccm_db: 25
  erp_class_dbw: 85
  fire_channels: 10
provenance:
  confidence: low
  notes: >-
    Source: 340 km detection range, tracks 20 targets. Fire channels (simultaneous guided engagements) are an estimate.
  estimates:
    - radar.r_ref_km
    - radar.scan_period_s
    - radar.field_of_regard_deg
    - radar.clutter_rejection
    - radar.eccm_db
    - radar.erp_class_dbw
    - radar.fire_channels
  sources:
    - { title: "S-400 missile system (components, missile table)", url: "https://en.wikipedia.org/wiki/S-400_missile_system", accessed: 2026-10-27 }
