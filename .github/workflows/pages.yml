name: Deploy to GitHub Pages

# Builds the game for hosting (ADR-040) and publishes it to GitHub Pages. Run by hand
# (Actions → Deploy to GitHub Pages → Run workflow); nothing deploys on push.
# The hosted build opens the neutral test war on the fixtures (scenarios/hosted-test.yaml)
# and downloads region packs from the Cloudflare R2 bucket in PACKS_URL.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Keep in step with ci.yml and docs/versions.md.
  WASM_BINDGEN_VERSION: 0.2.129
  # Public, read-only pack bucket (not a secret). Its CORS rule allows the Pages origin.
  PACKS_URL: https://pub-d4fd3783610043d99d736284964182e5.r2.dev/

# Actions are pinned to commit SHAs; the tag is in the comment.
jobs:
  build:
    name: Build the hosted game
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate types, build wb-wasm and the content pack
        run: pnpm gen
      - name: Build the fixtures content pack for the test war
        run: cargo run -q -p wb-cli -- content build --dir scenarios/fixtures --out build/fixtures.wbpack
      - name: Build the game
        run: pnpm --filter game build
        env:
          WB_SCENARIO: scenarios/hosted-test.yaml
          WB_CONTENT_PACK: build/fixtures.wbpack
          VITE_PACKS_URL: ${{ env.PACKS_URL }}
      - name: The hosted bundle carries no real-world demo
        run: |
          if grep -rIl -e 'Baltic demo' -e 'demo-baltic' apps/game/dist; then
            echo "The Baltic demo was bundled; check WB_SCENARIO" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/game/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
