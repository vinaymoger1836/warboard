name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with docs/versions.md.
  WASM_BINDGEN_VERSION: 0.2.129
  CARGO_DENY_VERSION: 0.20.2

# Actions are pinned to commit SHAs; the tag is in the comment.
jobs:
  rust:
    name: Rust (fmt, clippy, test, lint canary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Lint canary (f64::sin and HashMap in wb-sim must fail clippy)
        run: bash scripts/lint-canary.sh
      - name: Content check
        run: cargo run -q -p wb-cli -- content check
      - name: Content build twice, same hash
        run: |
          a=$(cargo run -q -p wb-cli -- content build --out build/a.wbpack)
          b=$(cargo run -q -p wb-cli -- content build --out build/b.wbpack)
          echo "content hash: $a"
          test "$a" = "$b"
          cmp build/a.wbpack build/b.wbpack

  deny:
    name: Licences and advisories (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check

  wasm:
    name: WASM build and determinism (native hash == Node WASM hash)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build wb-wasm
        run: node crates/wb-wasm/scripts/build-wasm.mjs
      - name: Generate TypeScript types (ts-rs) and the content JSON Schema
        run: |
          cargo test -q -p wb-core -p wb-sim -p wb-content --features wb-core/ts,wb-sim/ts,wb-content/ts export_bindings
          cargo run -q -p wb-cli -- content schema
      - name: Determinism check, 10,000 ticks
        run: bash scripts/determinism-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: |
            crates/wb-wasm/pkg/
            packages/protocol/src/generated/
          if-no-files-found: error
          retention-days: 3

  web:
    name: Web (typecheck, lint, build)
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated
          path: .
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r build
