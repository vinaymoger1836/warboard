  supply_floor_factor: 0.3
  fatigue_move_per_h: 0.06
  fatigue_combat_per_h: 0.15
  fatigue_recovery_per_h: 0.12
  fatigue_penalty: 0.3
  night_factor: 0.6
  ew_c2_factor: 0.85
  suppression_s: 300
