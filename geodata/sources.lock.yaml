# Pinned source versions (doc 05 §1, §7). The manifest copies these; nothing reads the clock.
# Change a version here, rebuild, and record the new pack sizes in docs/versions.md.

basemap:
  name: Protomaps basemap (daily build)
  version: "20261027"
  url: https://build.protomaps.com/20261027.pmtiles
  licence: ODbL-1.0 (tiles)
  attribution: "© OpenStreetMap contributors, Protomaps"
  accessed: 2026-10-28
  note: Daily builds are removed after a few weeks; the extracted packs are the durable copy.

natural_earth:
