# Determinism guards (CLAUDE.md rule 2, ADR-006). Applies to every crate in the workspace.
# scripts/lint-canary.sh proves these paths actually fire inside wb-sim.

disallowed-methods = [
    { path = "f64::sin", reason = "platform libm differs; use wb_core::math::sin" },
    { path = "f64::cos", reason = "platform libm differs; use wb_core::math::cos" },
    { path = "f64::tan", reason = "platform libm differs; use wb_core::math::tan" },
    { path = "f64::sin_cos", reason = "platform libm differs; use wb_core::math::sin and cos" },
    { path = "f64::asin", reason = "platform libm differs; use wb_core::math::asin" },
    { path = "f64::acos", reason = "platform libm differs; use wb_core::math::acos" },
    { path = "f64::atan", reason = "platform libm differs; use wb_core::math::atan" },
    { path = "f64::atan2", reason = "platform libm differs; use wb_core::math::atan2" },
    { path = "f64::sinh", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::cosh", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::tanh", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::asinh", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::acosh", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::atanh", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::exp", reason = "platform libm differs; use wb_core::math::exp" },
    { path = "f64::exp2", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::exp_m1", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::ln", reason = "platform libm differs; use wb_core::math::ln" },
    { path = "f64::log", reason = "platform libm differs; use wb_core::math::ln" },
    { path = "f64::log2", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::log10", reason = "platform libm differs; use wb_core::math::log10" },
    { path = "f64::ln_1p", reason = "platform libm differs; use libm via wb_core::math" },
    { path = "f64::powf", reason = "platform libm differs; use wb_core::math::pow" },
    { path = "f64::powi", reason = "LLVM powi is not correctly rounded; use wb_core::math::pow or multiply" },
    { path = "f64::hypot", reason = "platform libm differs; use wb_core::math::hypot" },
    { path = "f64::cbrt", reason = "platform libm differs; use wb_core::math::cbrt" },
    { path = "f32::sin", reason = "use f64 and wb_core::math" },
    { path = "f32::cos", reason = "use f64 and wb_core::math" },
    { path = "f32::tan", reason = "use f64 and wb_core::math" },
    { path = "f32::sin_cos", reason = "use f64 and wb_core::math" },
    { path = "f32::asin", reason = "use f64 and wb_core::math" },
    { path = "f32::acos", reason = "use f64 and wb_core::math" },
    { path = "f32::atan", reason = "use f64 and wb_core::math" },
    { path = "f32::atan2", reason = "use f64 and wb_core::math" },
    { path = "f32::exp", reason = "use f64 and wb_core::math" },
    { path = "f32::ln", reason = "use f64 and wb_core::math" },
    { path = "f32::log10", reason = "use f64 and wb_core::math" },
    { path = "f32::powf", reason = "use f64 and wb_core::math" },
    { path = "f32::powi", reason = "use f64 and wb_core::math" },
    { path = "f32::hypot", reason = "use f64 and wb_core::math" },
    { path = "f32::cbrt", reason = "use f64 and wb_core::math" },
]

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order varies; use BTreeMap, a sorted Vec, or wb_core::collections::LookupMap" },
    { path = "std::collections::HashSet", reason = "iteration order varies; use BTreeSet or a sorted Vec" },
    { path = "bevy_platform::collections::HashMap", reason = "iteration order varies; use BTreeMap, a sorted Vec, or wb_core::collections::LookupMap", allow-invalid = true },
    { path = "bevy_platform::collections::HashSet", reason = "iteration order varies; use BTreeSet or a sorted Vec", allow-invalid = true },
    { path = "hashbrown::HashMap", reason = "iteration order varies; use BTreeMap or wb_core::collections::LookupMap", allow-invalid = true },
    { path = "hashbrown::HashSet", reason = "iteration order varies; use BTreeSet or a sorted Vec", allow-invalid = true },
]
