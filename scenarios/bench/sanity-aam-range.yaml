# Test-bench sanity (doc 04 §5, doc 08 §3): catalogue AR-7 (MF-4 Sellis) against an HF-4 Corvan
# at the long end of its range while the target beams, and at half range head-on. The same
# behaviours G6 pins down on the fixtures, here on the real catalogue entries, so a content edit
# that breaks the missile class shows up. Run in the admin app's test bench or with `wb golden`.
name: Bench AAM against an aware fighter (catalogue)
seed: 101
content: content
start_utc: 2026-10-27T12:00:00Z
start_mode: deploy
sides:
  - { name: Blue, nations: [ald], roe: alpha }
  - { name: Red, nations: [vsm], roe: charlie, self_defence: false }
units:
  - { id: 10, name: Shooter, platform: mf-4, nation: ald, lat_deg: 55.0, lon_deg: 15.0, alt_m: 12000, heading_deg: 90, loadout: mf-4-air }
  - { id: 20, name: Target, platform: hf-4, nation: vsm, lat_deg: 55.0, lon_deg: 17.6, alt_m: 12000, heading_deg: 270 }
orders:
  - { tick: 0, side: 0, type: AssignTask, units: [10], task: { kind: move, waypoints: [[18.0, 55.0]], alt_m: 12000 } }
  - { tick: 0, side: 1, type: AssignTask, units: [20], task: { kind: move, waypoints: [[14.0, 55.0]], alt_m: 12000 } }
golden:
  id: B1
  description: AR-7 at maximum range against a beaming HF-4 mostly fails; at half range head-on its Pk is high
  max_ticks: 3000
  seeds: 100
  variants:
    max_range_beam:
      orders:
        - { tick: 0, side: 0, type: SetDoctrine, units: [10], launch: max_range, shots_per_target: 1 }
        - { tick: 0, side: 1, type: SetBehaviour, units: [20], threat_reaction: beam }
    half_range_head_on:
      orders:
        - { tick: 0, side: 0, type: SetDoctrine, units: [10], launch: close, shots_per_target: 1 }
        - { tick: 0, side: 1, type: SetBehaviour, units: [20], threat_reaction: none }
  expect:
    - { variant: max_range_beam, metric: outcome_fraction, side: 0, weapon: ar-7, filter: first, outcomes: [out_of_energy, miss, self_destruct], aggregate: mean, min: 0.7 }
    - { variant: half_range_head_on, metric: pk, side: 0, weapon: ar-7, filter: first, aggregate: mean, min: 0.6, max: 0.85 }
