# Test-bench sanity for a P8 addition: the light medium-range radar missile (AR-11) fired by an MF-3 Oriel
# head-on at an MF-4 that does not react, from the "close" launch distance. It has to land hits a good share
# of the time with a smaller seeker than the AR-7's; the point is to catch a value typo, not to rank missiles.
# The AI-8 is covered by the calibration rule (every weapon reaches its published range) and the content check.
name: Bench the AR-11 head-on (catalogue)
seed: 104
content: content
start_utc: 2026-10-27T12:00:00Z
start_mode: deploy
sides:
  - { name: Blue, nations: [hlv], roe: alpha }
  - { name: Red, nations: [vsm], roe: charlie, self_defence: false }
units:
  - { id: 10, name: Shooter, platform: mf-3, nation: hlv, lat_deg: 55.0, lon_deg: 15.0, alt_m: 9000, heading_deg: 90, loadout: mf-3-air }
  - { id: 20, name: Target, platform: mf-4, nation: vsm, lat_deg: 55.0, lon_deg: 16.2, alt_m: 9000, heading_deg: 270 }
orders:
  - { tick: 0, side: 0, type: AssignTask, units: [10], task: { kind: move, waypoints: [[18.0, 55.0]], alt_m: 9000 } }
  - { tick: 0, side: 1, type: AssignTask, units: [20], task: { kind: move, waypoints: [[14.0, 55.0]], alt_m: 9000 } }
  - { tick: 0, side: 1, type: SetBehaviour, units: [20], threat_reaction: none }
golden:
  id: B4
  description: MF-3 Oriel firing AR-11 head-on at an MF-4 that does not react
  max_ticks: 2400
  seeds: 100
  variants:
    close: { orders: [{ tick: 0, side: 0, type: SetDoctrine, units: [10], launch: close, shots_per_target: 1 }] }
  expect:
    - { variant: close, metric: launches, side: 0, aggregate: min, min: 1 }
    - { variant: close, metric: pk, side: 0, weapon: ar-11, filter: first, aggregate: mean, min: 0.3, max: 0.85 }
