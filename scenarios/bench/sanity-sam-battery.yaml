# Test-bench sanity: a catalogue medium-range battery (MR-SAM Tolven, SL-20) and its newer sibling
# (MR-SAM Varn, SL-18) against a lone MF-4 flying straight at the site at 6,000 m. A raider that does not
# react is shot down most of the time; one that beams the fire-control radar (the default reaction)
# defeats most shots, the same energy defeat G6 pins down for air-to-air missiles.
name: Bench SAM battery against a lone fighter (catalogue)
seed: 103
content: content
start_utc: 2026-10-27T10:00:00Z
start_mode: deploy
sides:
  - { name: Blue, nations: [ald], roe: alpha }
  - { name: Red, nations: [vsm], roe: charlie, self_defence: false }
units:
  - { id: 100, name: Tolven battery, system: mr-sam-tolven, nation: ald, lat_deg: 55.5, lon_deg: 17.0, heading_deg: 0 }
  - { id: 200, name: Varn battery, system: mr-sam-varn, nation: ald, lat_deg: 55.5, lon_deg: 17.0, heading_deg: 0 }
  - { id: 20, name: Raider, platform: mf-4, nation: vsm, lat_deg: 55.5, lon_deg: 19.0, alt_m: 6000, heading_deg: 270 }
orders:
  - { tick: 0, side: 1, type: AssignTask, units: [20], task: { kind: move, waypoints: [[16.0, 55.5]], alt_m: 6000 } }
golden:
  id: B3
  description: a medium-range battery against a lone fighter at 6,000 m, unaware (shot down) and beaming (shots defeated)
  max_ticks: 1800
  seeds: 100
  variants:
    tolven_unaware:
      drop_units: [200]
      orders: [{ tick: 0, side: 1, type: SetBehaviour, units: [20], threat_reaction: none }]
    varn_unaware:
      drop_units: [100]
      orders: [{ tick: 0, side: 1, type: SetBehaviour, units: [20], threat_reaction: none }]
    tolven_beam: { drop_units: [200] }
    varn_beam: { drop_units: [100] }
  expect:
    - { variant: tolven_unaware, metric: launches, side: 0, aggregate: min, min: 1 }
    - { variant: varn_unaware, metric: launches, side: 0, aggregate: min, min: 1 }
    - { variant: tolven_unaware, metric: units_lost, side: 1, aggregate: mean, min: 0.6 }
    - { variant: varn_unaware, metric: units_lost, side: 1, aggregate: mean, min: 0.6 }
    - { variant: tolven_beam, metric: units_lost, side: 1, aggregate: mean, max: 0.5 }
    - { variant: varn_beam, metric: units_lost, side: 1, aggregate: mean, max: 0.5 }
