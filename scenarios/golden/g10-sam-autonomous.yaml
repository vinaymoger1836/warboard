# G10 SAM Autonomous Mode: a test SAM site whose command post is destroyed
# drops into autonomous mode after an autonomous reaction delay
# (reaction_time_s * iads_autonomous_reaction_factor). In autonomous mode, the
# site can only engage targets tracked on its own radar (doc 02 §12), ignoring
# tracks from external remote radars.
name: G10 SAM Autonomous Mode
seed: 10
content: scenarios/fixtures
start_utc: 2026-10-27T10:00:00Z
start_mode: deploy
sides:
  - { name: Blue, nations: [tst], roe: alpha }
  - { name: Red, nations: [opp], roe: alpha }
units:
  # SAM site: 101 CP (C2), 102 Radar (120 deg sector North), 103/104 Launchers
  - { id: 100, name: SAMSite, system: test-sam-site, nation: tst, lat_deg: 55.5, lon_deg: 17.0, heading_deg: 0 }
  # Remote EW radar: 360 deg air search
  - { id: 200, name: EWRadar, platform: test-ew-radar-unit, nation: tst, lat_deg: 55.5, lon_deg: 17.0, heading_deg: 0 }
scripted_targets:
  # Target 901: South of SAM site (bearing 180 deg, outside 120 deg sector), seen only by remote EW radar
  - { id: 901, name: RemoteOnly, weapon: test-asm, nation: opp, lat_deg: 55.3, lon_deg: 17.0, alt_m: 6000, heading_deg: 0, speed_mps: 250 }
  # Target 902: North of SAM site (bearing 0 deg, inside 120 deg sector), tracked by SAM site's own radar
  - { id: 902, name: OwnRadar, weapon: test-asm, nation: opp, lat_deg: 55.75, lon_deg: 17.0, alt_m: 6000, heading_deg: 180, speed_mps: 250 }
orders:
  # Destroy the C2 node (command post 101) at tick 1
  - { tick: 1, side: 0, type: TestDestroyUnit, unit: 101 }
golden:
  id: G10-SAM-Autonomous
  description: SAM site with lost CP engages on own radar only after autonomous delay
  max_ticks: 300
  seeds: 5
  expect:
    - { metric: launches, side: 0, target: 901, max: 0 }
    - { metric: launches, side: 0, target: 902, min: 1 }
    - { metric: first_launch_time_s, side: 0, target: 902, min: 10.0 }
