# G2 (doc 08 §3): the same fighter radar head-on against a fighter and against
# a stealth fighter. Radar range scales with RCS^¼ (doc 02 §7.1), so the ratio
# of first-detection ranges must be within 20% of (σ₁/σ₂)^¼ of the two front
# RCS values. Rebuilt on the generic fixtures in PF (ADR-035), same band.
name: G2 RCS ratio head-on
seed: 2
content: scenarios/fixtures
start_utc: 2026-10-27T10:00:00Z
start_mode: deploy
sides:
  - { name: Blue, nations: [tst] }
  - { name: Red, nations: [opp] }
units:
  - { id: 10, name: Seeker, platform: test-fighter, nation: tst, lat_deg: 55.0, lon_deg: 10.0, alt_m: 9000, heading_deg: 90 }
  - { id: 20, name: Target, platform: test-fighter, nation: opp, lat_deg: 55.0, lon_deg: 14.7, alt_m: 9000, heading_deg: 270 }
orders:
  - { tick: 0, side: 0, type: AssignTask, units: [10], task: { kind: move, waypoints: [[16.0, 55.0]], alt_m: 9000 } }
  - { tick: 0, side: 1, type: AssignTask, units: [20], task: { kind: move, waypoints: [[9.0, 55.0]], alt_m: 9000 } }
golden:
  id: G2
  description: same fighter radar vs a fighter and a stealth fighter head-on, range ratio within 20% of (σ₁/σ₂)^¼
  max_ticks: 900
  seeds: 50
  variants:
    fighter: {}
    stealth: { replace: [{ unit: 20, platform: test-stealth-fighter, nation: opp }] }
  expect:
    - { variant: fighter, metric: first_detection_range_km, side: 0, target: 21, ratio_to: stealth, rcs_quarter_root: [test-fighter, test-stealth-fighter], min: 0.8, max: 1.2 }
    - { variant: stealth, metric: first_detection_range_km, side: 0, target: 21, min: 1 }
