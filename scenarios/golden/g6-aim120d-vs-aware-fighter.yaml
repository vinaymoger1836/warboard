# G6 (doc 08 §3, P5): an F-35A with AIM-120D against a Su-35S, head-on at
# 12 km. Fired at maximum range at a target that beams the missile, the
# AMRAAM mostly runs out of energy or misses; fired at half range at a
# target that holds its course, it hits 60–85 % of the time.
name: G6 AIM-120D vs aware fighter
seed: 6
start_utc: 2026-10-27T12:00:00Z
start_mode: deploy
sides:
  - { name: NATO, countries: [pol], roe: alpha }
  - { name: Russia, countries: [rus], roe: charlie, self_defence: false }
units:
  - { id: 10, name: Husarz, platform: f-35a, country: pol, lat_deg: 55.0, lon_deg: 15.0, alt_m: 12000, heading_deg: 90, loadout: f-35a-air-superiority }
  - { id: 20, name: Sokol, platform: su-35s, country: rus, lat_deg: 55.0, lon_deg: 17.6, alt_m: 12000, heading_deg: 270 }
orders:
  - { tick: 0, side: 0, type: AssignTask, units: [10], task: { kind: move, waypoints: [[18.0, 55.0]], alt_m: 12000 } }
  - { tick: 0, side: 1, type: AssignTask, units: [20], task: { kind: move, waypoints: [[14.0, 55.0]], alt_m: 12000 } }
golden:
  id: G6
  description: AIM-120D at max range vs a beaming Su-35S mostly fails; at half range head-on Pk 0.6–0.85
  max_ticks: 3000
  seeds: 500
  variants:
    max_range_beam:
      orders:
        - { tick: 0, side: 0, type: SetDoctrine, units: [10], launch: max_range, shots_per_target: 1 }
        - { tick: 0, side: 1, type: SetBehaviour, units: [20], threat_reaction: beam }
    half_range_head_on:
      orders:
        - { tick: 0, side: 0, type: SetDoctrine, units: [10], launch: close, shots_per_target: 1 }
        - { tick: 0, side: 1, type: SetBehaviour, units: [20], threat_reaction: none }
  expect:
    # A slow missile chasing a beaming target loses it off the seeker's
    # field of view and self-destructs: an energy defeat like running out.
    - { variant: max_range_beam, metric: outcome_fraction, side: 0, weapon: aim-120d, outcomes: [out_of_energy, miss, self_destruct], aggregate: mean, min: 0.7 }
    - { variant: half_range_head_on, metric: pk, side: 0, weapon: aim-120d, aggregate: mean, min: 0.6, max: 0.85 }
