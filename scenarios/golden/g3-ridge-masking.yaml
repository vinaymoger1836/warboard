# G3 (doc 08 §3): an aircraft at 100 m flies north behind a 600 m ridge,
# 20 km from a ground radar, and comes out past the ridge's north end. It must
# stay undetected while terrain blocks the line of sight and be seen soon
# after it clears. The ridge is synthetic terrain (test_terrain), so the
# golden runs without region packs.
name: G3 ridge masking
seed: 3
start_utc: 2026-10-27T10:00:00Z
start_mode: deploy
test_terrain:
  west: 20
  south: 54
  base_m: 10
  ridges:
    - { from: [20.5, 54.30], to: [20.5, 54.60], height_m: 600, half_width_m: 1500 }
sides:
  - { name: NATO, countries: [usa] }
  - { name: Russia, countries: [rus] }
units:
  - { id: 10, name: Radar, platform: an-mpq-65, country: usa, lat_deg: 54.45, lon_deg: 20.30, heading_deg: 60 }
  - { id: 20, name: Intruder, platform: su-35s, country: rus, lat_deg: 54.35, lon_deg: 20.70, alt_m: 100, heading_deg: 0 }
orders:
  - { tick: 0, side: 1, type: AssignTask, units: [20], task: { kind: move, waypoints: [[20.70, 54.99]], alt_m: 100 } }
golden:
  id: G3
  description: aircraft at 100 m behind a ridge vs ground radar, undetected until line of sight clears
  max_ticks: 900
  seeds: 50
  expect:
    - { metric: clearance_at_first_detection_m, side: 0, observer: 11, target: 21, aggregate: min, min: -100 }
    - { metric: first_detection_after_los_clear_s, side: 0, observer: 11, target: 21, aggregate: max, max: 60 }
