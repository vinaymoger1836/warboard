# G18 (doc 08 §3, P11): the same attack on open, mountain and urban ground.
# Three identical fights far apart on test land: a tank battalion (31 tanks)
# attacks an infantry battalion (36 sections) that holds in prepared defence.
# Only the defender's cell differs. The attackers cross the same open ground
# and meet their enemy at the same time; the run stops 25 minutes into the
# fight, before anyone breaks.
#
# Loss ratio = share of strength the attacker lost / share the defender lost.
# Expected (doc 05 §3, realism `ground.defender_terrain_factor`): open <
# mountain < urban.
name: G18 ground combat by terrain
seed: 1800
content: scenarios/fixtures
start_utc: 2026-10-27T09:00:00Z
start_mode: deploy
test_terrain:
  west: 16
  south: 55
  cols: 1
  rows: 1
  base_m: 40
  land:
    - { class: open, box: [16.20, 55.10, 16.90, 55.90] }
    - { class: mountain, box: [16.56, 55.47, 16.64, 55.53] }
    - { class: urban, box: [16.56, 55.77, 16.64, 55.83] }
sides:
  - { name: Blue, nations: [tst], roe: charlie }
  - { name: Red, nations: [opp], roe: charlie }
units:
  - { id: 110, name: Tanks open, system: test-tank-battalion, nation: tst, lat_deg: 55.20, lon_deg: 16.45 }
  - { id: 120, name: Tanks mountain, system: test-tank-battalion, nation: tst, lat_deg: 55.50, lon_deg: 16.45 }
  - { id: 130, name: Tanks urban, system: test-tank-battalion, nation: tst, lat_deg: 55.80, lon_deg: 16.45 }
  - { id: 210, name: Infantry open, system: test-infantry-battalion, nation: opp, lat_deg: 55.20, lon_deg: 16.60, posture: prepared }
  - { id: 220, name: Infantry mountain, system: test-infantry-battalion, nation: opp, lat_deg: 55.50, lon_deg: 16.60, posture: prepared }
  - { id: 230, name: Infantry urban, system: test-infantry-battalion, nation: opp, lat_deg: 55.80, lon_deg: 16.60, posture: prepared }
orders:
  - { tick: 0, side: 1, type: AssignTask, units: [210, 220, 230], task: { kind: hold } }
  - { tick: 0, side: 0, type: AssignTask, units: [110], task: { kind: attack, point: [16.60, 55.20] } }
  - { tick: 0, side: 0, type: AssignTask, units: [120], task: { kind: attack, point: [16.60, 55.50] } }
  - { tick: 0, side: 0, type: AssignTask, units: [130], task: { kind: attack, point: [16.60, 55.80] } }
golden:
  id: G18
  description: same ground attack on open, mountain and urban cells; loss ratios ordered open < mountain < urban
  max_ticks: 3100
  seeds: 5
  expect:
    - { metric: loss_ratio, group: 110, target: 210, min: 0.1, max: 0.4 }
    - { metric: loss_ratio, group: 120, target: 220, over: { metric: loss_ratio, group: 110, target: 210 }, aggregate: min, min: 1.2 }
    - { metric: loss_ratio, group: 130, target: 230, over: { metric: loss_ratio, group: 120, target: 220 }, aggregate: min, min: 1.2 }
    # The attackers took about the same losses everywhere; the defenders did not.
    - { metric: strength_lost, group: 210, min: 0.3, max: 0.7 }
    - { metric: strength_lost, group: 230, min: 0.1, max: 0.35 }
