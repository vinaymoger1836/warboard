# The war the browser app opens until war setup arrives in P9: NATO against
# Russia around the Baltic, garrisoned on real bases. P4 adds Russian forces
# around Kaliningrad, a Growler for ESM and satellites on both sides, so the
# fog of war has something to show; P5 lets the F-35s ask to engage from max
# range. Not a golden scenario.
